[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dtoc"
version = "0.1.0rc1"
authors = [
  { name="Simon Glass", email="sjg@chromium.org" },
]
description = "Convert devicetree files into C code, for U-Boot's of-platdata"
readme = "README.rst"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["u-boot", "devicetree", "dtb", "firmware", "code-generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
    "Intended Audience :: Developers",
]
dependencies = [
    "pylibfdt >= 1.7",
    "u-boot-pylib >= 0.1.0",
]

[project.optional-dependencies]
# Running the test suite (parallel test execution and coverage)
test = ["concurrencytest", "coverage"]

[project.urls]
Homepage = "https://github.com/deinde-dev/dtoc"
Documentation = "https://dtoc.readthedocs.io/"
Repository = "https://github.com/deinde-dev/dtoc"
"Bug Tracker" = "https://github.com/deinde-dev/dtoc/issues"

[project.scripts]
dtoc = "dtoc.main:run_dtoc"

[tool.setuptools.packages.find]
# dtoc.test holds the test data, found as a namespace package
include = ["dtoc*"]

[tool.setuptools.package-data]
dtoc = ["*.rst"]
"dtoc.test" = ["*"]
